<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store slides</title>
<!-- Template for scripts/store-images.mjs. One slide per #hash; the script fills DATA.
     Built the way Material shows M3 Expressive: one tonal scheme per slide, flat bento tiles with big
     corners, the real UI straight and unshadowed, bleeding out of its tile, and one emphasized word. -->
<script>/*DATA*/</script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: 'GSF', sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
  .slide { position: absolute; inset: 0; overflow: hidden; }
  .tile { position: absolute; overflow: hidden; border-radius: 40px; }
  .shape { position: absolute; display: block; }
  .shape path { fill: currentColor; }
  .ui { position: absolute; overflow: hidden; border-radius: 28px; }
  .ui img { position: absolute; display: block; max-width: none; }
  .head {
    position: absolute;
    font-weight: 440;
    font-variation-settings: 'ROND' 100;
    letter-spacing: -0.03em;
    line-height: 1;
    text-wrap: balance;
  }
  /* Display emphasized: the same face pushed heavy and wide, as Material's "Gg". */
  .head em {
    font-style: normal;
    font-weight: 820;
    font-stretch: 122%;
    font-variation-settings: 'ROND' 100;
    letter-spacing: -0.035em;
  }
  .icon { font-family: 'Symbols'; font-weight: normal; font-style: normal; line-height: 1; display: inline-block; }
  .brand { position: absolute; display: flex; align-items: center; gap: 14px; font-weight: 500; letter-spacing: -0.01em; }
</style>
</head>
<body>
<script>
  const { shapes, font, symbols, icons, caps, roles, dims, grid } = window.DATA;
  const { M, gap, R: TR, inset, ui: UR, pad, left: LW, right: RW, colH } = grid;
  const css = document.createElement('style');
  css.textContent = `
    @font-face { font-family: 'GSF'; src: url('${font}') format('woff2'); font-weight: 1 1000; font-stretch: 25% 151%; }
    @font-face { font-family: 'Symbols'; src: url('${symbols}') format('woff2'); font-weight: 300 600; }`;
  document.head.append(css);

  // The App Store set is for Macs: ⌘K instead of Ctrl K.
  const mac = new URLSearchParams(location.search).has('mac');
  const command = '<svg viewBox="0 0 24 24" width="46%" height="46%" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>';

  const shape = (name, { x, y, size, color, rot = 0, z = 0 }) =>
    `<svg class="shape" viewBox="0 0 1 1" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;color:${color};transform:rotate(${rot}deg);z-index:${z}"><path d="${shapes[name]}"/></svg>`;

  const icon = (name, size, color) =>
    `<span class="icon" style="font-size:${size}px;color:${color};font-variation-settings:'FILL' 1,'wght' 500,'opsz' 48">${String.fromCodePoint(icons[name])}</span>`;

  /** A flat tonal container, 48px corners. Everything inside is placed relative to it. */
  const tile = (inner, { x, y, w, h, bg }) =>
    `<div class="tile" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg};border-radius:${TR}px">${inner}</div>`;

  /** Lays a column out top to bottom on the grid: fixed heights as given, `fill` takes what's left. */
  const stack = (hs, top = M, total = colH) => {
    const fixed = hs.reduce((a, h) => a + (h === 'fill' ? 0 : h), 0) + gap * (hs.length - 1);
    let y = top;
    return hs.map((h) => {
      const height = h === 'fill' ? total - fixed : h;
      const out = { y, h: height };
      y += height + gap;
      return out;
    });
  };

  /** A window onto a full 1440x900 capture, filling the tile less its inset: 28px corners, concentric with the tile. */
  const frame = (cap, { tw, th, sx = 0, sy = 0, k }) => {
    const w = tw - 2 * inset;
    const h = th - 2 * inset;
    return `<div class="ui" style="left:${inset}px;top:${inset}px;width:${w}px;height:${h}px;border-radius:${UR}px">
      <img src="${caps[cap]}" style="width:${1440 * k}px;left:${-sx * k}px;top:${-sy * k}px"></div>`;
  };

  /** A card or pane captured at exactly its shown size, corners and all. Its tile is it plus the inset. */
  const card = (cap) => `<img src="${caps[cap]}" style="position:absolute;left:${inset}px;top:${inset}px;width:${dims[cap].w}px;height:${dims[cap].h}px">`;
  const hug = (cap) => dims[cap].h + 2 * inset;

  const head = (html, { x, y, w, size, ink, align = 'left' }) =>
    `<h1 class="head" style="left:${x}px;top:${y}px;width:${w}px;font-size:${size}px;color:${ink};text-align:${align}">${html}</h1>`;

  /** The app's mark: a Cookie 9 with the envelope, as in the toolbar icon. */
  const mark = (size, bg, fg) => `<svg width="${size}" height="${size}" viewBox="0 0 128 128" style="display:block;flex:none">
      <g transform="translate(4 4) scale(120)"><path d="${shapes.Cookie9Sided}" fill="${bg}"/></g>
      <g fill="none" stroke="${fg}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><rect x="34" y="42" width="60" height="44" rx="8"/><path d="M36 48 L64 68 L92 48"/></g></svg>`;

  /** Android's colour option: a circle split into primary, secondary and tertiary. */
  const swatch = (x, y, size, [a, b, c], selected, ring) => `
    <div style="position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px">
      ${selected ? shape('Cookie9Sided', { x: -12, y: -12, size: size + 24, color: ring }) : ''}
      <div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;grid-template:1fr 1fr/1fr 1fr">
        <span style="grid-column:1/3;background:${a}"></span><span style="background:${b}"></span><span style="background:${c}"></span>
      </div>
    </div>`;

  /** A key as a Material shape with its legend. */
  const key = (legend, { x, y, size, name, bg, fg, text = 0.42 }) => `
    <div style="position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px">
      ${shape(name, { x: 0, y: 0, size, color: bg })}
      <span style="position:absolute;inset:0;display:grid;place-items:center;color:${fg};font-size:${size * text}px;font-weight:600;font-variation-settings:'ROND' 100">${legend}</span>
    </div>`;

  /** Frames a box of a capture so it sits `pad` in from the frame's top, leading and trailing edges. */
  const framed = (box, tw, th) => {
    const k = (tw - 2 * inset - 2 * pad) / box.width;
    return { tw, th, k, sx: box.x - pad / k, sy: box.y - pad / k };
  };
  const R = (cap) => roles[cap];
  const X1 = M;
  const X2 = M + LW + gap;
  const H1 = 72; // headline size on every slide but the hero, whose word has to fit its tile

  /** The brand mark sitting in a tile's bottom trailing corner, `pad` from both edges. */
  const cornerMark = (inner, size, tw, th) =>
    `<div style="position:absolute;left:${tw - pad - size}px;top:${th - pad - size}px;width:${size}px;height:${size}px">${inner}</div>`;

  const slides = {
    '1-expressive': () => {
      const c = R('inbox');
      return `<div class="slide" style="background:${c['surface-container-high']}">
        ${tile(`
          ${head('Your inbox,<br><em>expressive</em>', { x: pad, y: pad, w: LW - 2 * pad, size: 60, ink: c['on-primary-container'] })}
          ${cornerMark(mark(240, c['primary'], c['on-primary']), 240, LW, colH)}`,
          { x: X1, y: M, w: LW, h: colH, bg: c['primary-container'] })}
        ${tile(frame('inbox', { tw: RW, th: colH, k: (colH - 2 * inset) / 900 }), { x: X2, y: M, w: RW, h: colH, bg: c['surface-container-highest'] })}
      </div>`;
    },

    '2-at-a-glance': () => {
      const c = R('glancePane');
      const [a, b] = stack(['fill', hug('code')]);
      return `<div class="slide" style="background:${c['surface-container-high']}">
        ${tile(head('Your morning, <em>sorted</em>', { x: pad, y: pad, w: LW - 2 * pad, size: H1, ink: c['on-primary-container'] }), { x: X1, y: a.y, w: LW, h: a.h, bg: c['primary-container'] })}
        ${tile(card('code'), { x: X1, y: b.y, w: LW, h: b.h, bg: c['tertiary-container'] })}
        ${tile(card('glancePane'), { x: X2, y: M, w: RW, h: hug('glancePane'), bg: c['surface-container-highest'] })}
      </div>`;
    },

    '3-themes': () => {
      const c = R('purple');
      const t = R('teal');
      const d = R('pinkDark');
      const cw = (LW + gap + RW - gap) / 2;
      const rh = (colH - gap) / 2;
      const k = 0.8875;
      const glance = { tw: cw, th: rh, sx: 744, sy: 130, k };
      const sw = 60;
      const sy = rh - pad - sw;
      const swatches = [
        ['#0b57d0', '#c2e7ff', '#c4eed0'],
        ['#006a6a', '#cce8e7', '#d9e2ff'],
        [c['primary'], c['secondary-container'], c['tertiary-container']],
        ['#984061', '#ffd9e2', '#ffdcc1'],
        ['#386a20', '#d9e7cb', '#bcebeb'],
      ];
      return `<div class="slide" style="background:${c['surface-container-high']}">
        ${tile(`
          ${head('Make it <em>yours</em>', { x: pad, y: pad, w: cw - 2 * pad, size: H1, ink: c['on-primary-container'] })}
          ${swatches.map((s, i) => swatch(pad + i * (sw + 32), sy, sw, s, i === 2, c['on-primary-container'])).join('')}`,
          { x: M, y: M, w: cw, h: rh, bg: c['primary-container'] })}
        ${tile(frame('teal', glance), { x: M + cw + gap, y: M, w: cw, h: rh, bg: t['primary-container'] })}
        ${tile(frame('purple', glance), { x: M, y: M + rh + gap, w: cw, h: rh, bg: c['tertiary-container'] })}
        ${tile(frame('pinkDark', glance), { x: M + cw + gap, y: M + rh + gap, w: cw, h: rh, bg: d['primary-container'] })}
      </div>`;
    },

    '4-command-palette': () => {
      const c = R('palette');
      const keys = 296;
      const [a, b] = stack(['fill', keys]);
      const ks = 176;
      const kx = (LW - 2 * ks - 24) / 2;
      const ky = (keys - ks) / 2;
      return `<div class="slide" style="background:${c['surface']}">
        ${tile(head(`${mac ? '⌘K.' : 'Ctrl K.'} <em>Done.</em>`, { x: pad, y: pad, w: LW - 2 * pad, size: H1 + 24, ink: c['on-surface'] }), { x: X1, y: a.y, w: LW, h: a.h, bg: c['surface-container-high'] })}
        ${tile(`
          ${key(mac ? command : 'Ctrl', { x: kx, y: ky, size: ks, name: 'Square', bg: c['primary'], fg: c['on-primary'], text: 0.28 })}
          ${key('K', { x: kx + ks + 24, y: ky, size: ks, name: 'Cookie4Sided', bg: c['tertiary-container'], fg: c['on-tertiary-container'] })}`,
          { x: X1, y: b.y, w: LW, h: b.h, bg: c['primary-container'] })}
        ${tile(frame('palette', framed(dims['palette .palette'], RW, colH)), { x: X2, y: M, w: RW, h: colH, bg: c['surface-container-low'] })}
      </div>`;
    },

    '5-smart-cards': () => {
      const c = R('amber');
      const [a, b] = stack(['fill', hug('deal')]);
      const [p, q] = stack([hug('package'), hug('invite')]);
      return `<div class="slide" style="background:${c['surface-container-high']}">
        ${tile(head('Less tab <em>hopping</em>', { x: pad, y: pad, w: LW - 2 * pad, size: H1, ink: c['on-primary-container'] }), { x: X1, y: a.y, w: LW, h: a.h, bg: c['primary-container'] })}
        ${tile(card('deal'), { x: X1, y: b.y, w: LW, h: b.h, bg: c['primary'] })}
        ${tile(card('package'), { x: X2, y: p.y, w: RW, h: p.h, bg: c['tertiary-container'] })}
        ${tile(card('invite'), { x: X2, y: q.y, w: RW, h: q.h, bg: c['secondary-container'] })}
      </div>`;
    },

    '6-dark-theme': () => {
      const c = R('promoDark');
      const moon = 240;
      return `<div class="slide" style="background:${c['surface']}">
        ${tile(`
          ${head('Lights <em>off</em>', { x: pad, y: pad, w: LW - 2 * pad, size: H1 + 24, ink: c['on-surface'] })}
          ${cornerMark(`${shape('Cookie12Sided', { x: 0, y: 0, size: moon, color: c['primary-container'] })}
            <span style="position:absolute;inset:0;display:grid;place-items:center">${icon('dark_mode', 96, c['on-primary-container'])}</span>`, moon, LW, colH)}`,
          { x: X1, y: M, w: LW, h: colH, bg: c['surface-container-high'] })}
        ${tile(card('promoDark'), { x: X2, y: M, w: RW, h: hug('promoDark'), bg: c['surface-container-low'] })}
      </div>`;
    },

    'promo-small': () => {
      const c = R('inbox');
      const p = 28;
      return `<div class="slide" style="background:${c['primary-container']}">
        ${head('<em>Expressive</em><br>Gmail', { x: p, y: p, w: 300, size: 44, ink: c['on-primary-container'] })}
        <div style="position:absolute;left:${440 - p - 120}px;top:${280 - p - 120}px">${mark(120, c['primary'], c['on-primary'])}</div>
      </div>`;
    },

    // The window shown big and anchored at its top-left corner, like the hero slide: shrunk to fit whole,
    // its own corners and edge controls crowd the frame's.
    'promo-marquee': () => {
      const c = R('inbox');
      const lw = 560;
      const h = 560 - 2 * M;
      const rw = 1400 - 2 * M - lw - gap;
      return `<div class="slide" style="background:${c['surface-container-high']}">
        ${tile(`
          ${head('Your inbox,<br><em>expressive</em>', { x: pad, y: pad, w: lw - 2 * pad, size: 68, ink: c['on-primary-container'] })}
          <div class="brand" style="left:${pad}px;bottom:${pad}px;font-size:22px;line-height:1;color:${c['on-primary-container']}">${mark(40, c['primary'], c['on-primary'])}Expressive Gmail</div>`,
          { x: M, y: M, w: lw, h, bg: c['primary-container'] })}
        ${tile(frame('inbox', { tw: rw, th: h, k: 0.72 }), { x: M + lw + gap, y: M, w: rw, h, bg: c['surface-container-highest'] })}
      </div>`;
    },
  };

  const id = location.hash.slice(1) || '1-expressive';
  document.body.innerHTML = slides[id]();
  Promise.all([document.fonts.load('440 20px GSF'), document.fonts.load('24px Symbols'), ...[...document.images].map((i) => i.decode())])
    .then(() => document.fonts.ready)
    .then(() => {
      document.body.dataset.ready = '1';
    });
</script>
</body>
</html>
